<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Akamai Audit Tool</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/styles.css?v=20260921-1">
</head>
<body class="login-page">
  <div class="surface login-card">
    <div class="card-body">
      <h1 class="card-title mb-1 fw-bold" style="font-size:24px">
        <i class="bi bi-shield-lock me-2 text-primary"></i>Akamai Audit
      </h1>
      <p class="text-muted small mb-4">Sign in to continue</p>

      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label for="passwordInput" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <input type="password" name="password" id="passwordInput" autocomplete="current-password" class="form-control" autofocus required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Sign in</button>
      </form>
    </div>
  </div>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.replace(isHidden ? 'bi-eye' : 'bi-eye-slash', isHidden ? 'bi-eye-slash' : 'bi-eye');
    });
  </script>
</body>
</html>
