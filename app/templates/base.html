<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b4d">
  <title>{% block title %}Akamai Audit{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/styles.css?v=20260921-1">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="app-header">
  <nav class="app-nav" aria-label="Main navigation">
    <a class="app-brand" href="/"><span class="brand-mark"><i class="bi bi-shield-check" aria-hidden="true"></i></span><span>Akamai <strong>Audit</strong></span></a>
    <span class="workspace-label">INTERNAL WORKSPACE</span>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a class="nav-home" href="/"><i class="bi bi-grid me-2" aria-hidden="true"></i>Reports</a>
      <a href="/logout" class="btn btn-light btn-sm"><i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Sign out</a>
    </div>
  </nav>
</header>
<main id="main-content" class="app-main">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="/static/js/columns.js?v=20260921-1"></script>
<script src="/static/js/audit.js?v=20260921-1"></script>
{% block scripts %}{% endblock %}
</body>
</html>
