{# HTMX keeps polling because this partial retains the hx-* attributes #}
<div
  id="report-content"
  hx-get="/api/reports/{{ task_id }}/status"
  hx-trigger="every 2s"
  hx-target="#report-content"
  hx-swap="outerHTML"
>
  <div class="card shadow-sm p-4">
    <div class="d-flex align-items-center mb-3">
      <div class="spinner-border spinner-border-sm text-primary me-3" role="status"></div>
      <span class="fw-semibold">{{ step }}</span>
    </div>
    <div class="progress" style="height:20px">
      <div
        class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
        role="progressbar"
        style="width: {{ pct }}%"
        aria-valuenow="{{ pct }}"
        aria-valuemin="0"
        aria-valuemax="100"
      >{{ pct }}%</div>
    </div>
    <p class="text-muted small mt-2 mb-3">This may take several minutes for large accounts.</p>
    <form method="post" action="/api/reports/{{ task_id }}/cancel"
          onsubmit="return confirm('Cancel this report?');">
      <button type="submit" class="btn btn-outline-danger btn-sm">
        <i class="bi bi-x-circle me-1"></i>Cancel Report
      </button>
    </form>
  </div>
</div>
