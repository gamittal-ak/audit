<div id="report-content" hx-get="/api/reports/{{ task_id }}/status" hx-trigger="every 2s" hx-target="#report-content" hx-swap="outerHTML">
  <section class="surface progress-panel" aria-labelledby="progress-title">
    <span class="eyebrow">AUDIT IN PROGRESS</span><h1 id="progress-title">Collecting your account data</h1>
    <p class="text-muted">You can return to report history while this audit runs.</p>
    <div class="d-flex justify-content-between gap-3 mb-2"><span role="status">{{ step }}</span><strong>{{ pct }}%</strong></div>
    <div class="progress" style="height:8px"><div class="progress-bar" role="progressbar" style="width:{{ pct }}%" aria-valuenow="{{ pct }}" aria-valuemin="0" aria-valuemax="100" aria-label="Audit progress"></div></div>
    {% include "partials/audit_log.html" %}
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4"><a href="/" class="btn btn-outline-secondary">Back to reports</a>
      <form method="post" action="/api/reports/{{ task_id }}/cancel" onsubmit="return confirm('Cancel this running audit?');"><button type="submit" class="btn btn-outline-danger btn-sm">Cancel audit</button></form>
    </div>
  </section>
</div>
