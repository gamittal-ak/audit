{% extends "base.html" %}
{% block title %}Report — Akamai Audit{% endblock %}
{% block content %}
<div class="report-breadcrumb"><a href="/"><i class="bi bi-arrow-left me-2" aria-hidden="true"></i>All reports</a><span>/</span><span>Audit report</span></div>
<div id="report-content" hx-get="/api/reports/{{ task_id }}/status" hx-trigger="load, every 2s" hx-target="#report-content" hx-swap="outerHTML">
  <div class="surface loading-state"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading</span></div><h1>Opening report</h1><p>Retrieving audit status and collected data.</p></div>
</div>
{% endblock %}
